<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        const storedScheme = localStorage.getItem("color-scheme");
        if (storedScheme === "light" || storedScheme === "dark") {
          document.querySelector('meta[name="color-scheme"]').content = storedScheme;
          document.documentElement.setAttribute("data-theme", storedScheme);
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Caveat:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <title>PerfumeScan • Almacén de perfumes: precios de hoy en Chile</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
